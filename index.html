<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>あこちゃんのおやつゲーム</title>

    <style>
        body {
            margin: 0;
            text-align: center;
            background: #fff9c4; /* 薄い黄色 */
            font-family: Arial, sans-serif;
        }

        #game {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        canvas {
            border: 4px solid #ffb703;
            background: #ffe4f2; /* うすいピンク（箱の中） */
        }

        h1 {
            font-size: 40px;
            color: #ff6f91;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        #score, #next {
            font-size: 24px;
            margin: 5px 0;
            color: #d85a7f;
        }

        /* 🎉 おめでとうメッセージ */
        #message {
            font-size: 60px;
            color: gold;
            display: none;
            animation: sparkle 1s infinite;
        }

        @keyframes sparkle {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* GAME OVER 表示 */
        #gameover {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>

    <h1>🍰 あこちゃんのおやつゲーム 🍓</h1>

    <div id="score">スコア: 0</div>
    <div id="next">次のおやつ：<img id="nextImg" width="40"></div>

    <div id="message">🎉 おめでとう！ 🎉</div>
    <div id="game"></div>
    <div id="gameover">GAME OVER</div>

    <!-- Matter.js -->
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>

    <!-- ★★★ ゲームの JavaScript ★★★ -->
    <script>
        const { Engine, Render, World, Bodies, Events, Composite } = Matter;

        const engine = Engine.create();
        engine.world.gravity.y = 0.4;

        let score = 0;
        let nextLevel = 0;

        const render = Render.create({
            element: document.getElementById("game"),
            engine: engine,
            options: {
                width: 400,
                height: 600,
                wireframes: false
            }
        });

        World.add(engine.world, [
            Bodies.rectangle(200, 650, 400, 100, { isStatic: true }),
            Bodies.rectangle(-20, 300, 40, 600, { isStatic: true }),
            Bodies.rectangle(420, 300, 40, 600, { isStatic: true })
        ]);

        const gameOverLineY = 180;

        const snackImages = [
            "img/blueberry.png",
            "img/strawberry.png",
            "img/whip.png",
            "img/cookie.png",
            "img/cheesecake.png"
        ];

        const snackSize = [10, 15, 50, 60, 30];

        function updateNext() {
            nextLevel = Math.floor(Math.random() * 3);
            document.getElementById("nextImg").src = snackImages[nextLevel];
        }
        updateNext();

        const baseImageSizes = [225, 225, 225, 225, 225];

        function createSnack(x, level = 0) {
            const size = snackSize[level];
            const baseSize = baseImageSizes[level];

            return Bodies.circle(x, 40, size, {
                label: "snack",
                level: level,
                restitution: 0.05,
                friction: 0.9,
                frictionStatic: 1.0,
                frictionAir: 0.02,
                render: {
                    sprite: {
                        texture: snackImages[level],
                        xScale: (size * 2) / baseSize,
                        yScale: (size * 2) / baseSize
                    }
                }
            });
        }

        function addScore(level) {
            score += (level + 1) * 10;
            document.getElementById("score").innerText = "スコア: " + score;
        }

        function mergeSnacks(a, b) {
            const newLevel = a.level + 1;
            const x = (a.position.x + b.position.x) / 2;

            World.remove(engine.world, a);
            World.remove(engine.world, b);

            const newSnack = createSnack(x, newLevel);
            World.add(engine.world, newSnack);

            addScore(newLevel);

            if (newLevel === snackImages.length - 1) {
                setTimeout(() => {
                    const msg = document.getElementById("message");
                    msg.style.display = "block";
                    setTimeout(() => msg.style.display = "none", 2000);
                }, 300);
            }

            setTimeout(() => checkChainMerge(newSnack), 50);
        }

        function checkChainMerge(body) {
            const bodies = Composite.allBodies(engine.world);

            for (let other of bodies) {
                if (other === body) continue;
                if (other.label !== "snack") continue;
                if (other.level !== body.level) continue;

                const dx = other.position.x - body.position.x;
                const dy = other.position.y - body.position.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < snackSize[body.level] * 1.2) {
                    mergeSnacks(body, other);
                    return;
                }
            }
        }

        Events.on(engine, "collisionStart", event => {
            event.pairs.forEach(pair => {
                const a = pair.bodyA;
                const b = pair.bodyB;

                if (a.label === "snack" && b.label === "snack") {
                    if (a.level === b.level) mergeSnacks(a, b);
                }
            });
        });

        document.addEventListener("click", e => {
            const rect = render.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;

            const snack = createSnack(x, nextLevel);
            World.add(engine.world, snack);

            updateNext();
        });

        Engine.run(engine);
        Render.run(render);
    </script>

</body>
</html>
