<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>あこちゃんのおやつゲーム</title>
<style>
  body {
    margin: 0;
    text-align: center;
    background: #fff8f0;
    font-family: Arial, sans-serif;
  }
  h1 {
    font-size: 40px;
    color: #ff6f91;
  }
  #message {
    font-size: 60px;
    color: gold;
    display: none;
    animation: sparkle 1s infinite;
  }
  @keyframes sparkle {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
  }
  #game {
    display: flex;
    justify-content: center;
  }
  canvas {
    border: 4px solid #ffb703;
    background: #fff;
  }
</style>
</head>
<body>

<h1>🍰 あこちゃんのおやつゲーム 🍓</h1>

<div id="score">スコア: 0</div>
<div id="next">次のおやつ：<img id="nextImg" width="40"></div>

<div id="message">🎉 おめでとう！ 🎉</div>
<div id="game"></div>

<!-- Matter.js 読み込み -->
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>

<!-- ★★★ ここからゲームの JavaScript ★★★ -->
<script>

const { Engine, Render, World, Bodies, Events } = Matter;

const engine = Engine.create();
engine.world.gravity.y = 0.4;

let score = 0;
let nextLevel = 0;

// Canvas を #game の中に描画
const render = Render.create({
  element: document.getElementById("game"),
  engine: engine,
  options: {
    width: 400,
    height: 600,
    wireframes: false
  }
});

// 地面（画面外に配置）
const ground = Bodies.rectangle(200, 650, 400, 100, { isStatic: true });
World.add(engine.world, ground);

// GitHub の画像ファイル名
const snackImages = [
  "blueberry.png.png",
  "strawberry.png.png",
  "whip.png.png",
  "cookie.png.png",
  "cheesecake.png.png"
];

// サイズ調整
const snackScale = [0.06, 0.08, 0.80, 0.80, 0.30];

// おやつ生成
function createSnack(x, level = 0) {
  const scale = snackScale[level];
  const baseSize = 35;
  const size = baseSize * scale;

  return Bodies.rectangle(x, 40, size, size, {
    label: "snack",
    level: level,
    friction: 1.0,
    frictionStatic: 1.0,
    restitution: 0.0,
    density: 0.002,
    render: {
      sprite: {
        texture: snackImages[level],
        xScale: scale,
        yScale: scale
      }
    }
  });
}

// クリックで落とす
document.addEventListener("click", e => {
  const rect = render.canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  World.add(engine.world, createSnack(x));
});

// 合体処理
Events.on(engine, "collisionStart", event => {
  event.pairs.forEach(pair => {
    const a = pair.bodyA;
    const b = pair.bodyB;

    if (a.label === "snack" && b.label === "snack" && a.level === b.level) {
      if (a.level === snackImages.length - 1) return;

      World.remove(engine.world, [a, b]);

      const next = createSnack(
        (a.position.x + b.position.x) / 2,
        a.level + 1
      );
      World.add(engine.world, next);

      if (next.level === snackImages.length - 1) {
        document.getElementById("message").style.display = "block";
      }
    }
  });
});

Engine.run(engine);
Render.run(render);

</script>
<!-- ★★★ ここまでゲームの JavaScript ★★★ -->

</body>
</html>
