<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>あこちゃんのおやつゲーム</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            background: #fff9c4;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 32px;
            color: #ff6f91;
            margin: 10px 0;
        }

        #score {
            font-size: 20px;
            color: #d85a7f;
        }

        #game {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        canvas {
            border: 4px solid #ffb703;
            background: #ffe4f2;
        }

        #next {
            font-size: 18px;
            margin-top: 5px;
            color: #d85a7f;
        }

        #next img {
            vertical-align: middle;
        }

        #message {
            font-size: 40px;
            color: gold;
            display: none;
            animation: sparkle 1s infinite;
            margin-top: 10px;
        }

        @keyframes sparkle {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        #gameover {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: bold;
            color: red;
            text-shadow: 2px 2px 0 #fff;
        }

        #restart {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            background: #ff9eaa;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🍰 あこちゃんのおやつゲーム🍓</h1>
    <div id="score">スコア: 0</div>
    <div id="next">次のおやつ：<img id="nextImg" width="40"></div>
    <div id="message">🎉 おめでとう！ 🎉</div>

    <div id="game">
        <canvas id="world"></canvas>
    </div>

    <div id="gameover">GAME OVER</div>
    <button id="restart">リスタート</button>

    <!-- Matter.js -->
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>

    <script>
    const { Engine, Render, Runner, World, Bodies, Events, Composite } = Matter;

    const width = 400;
    const height = 600;

    const engine = Engine.create();
    const world = engine.world;

    const canvas = document.getElementById("world");
    canvas.width = width;
    canvas.height = height;

    const render = Render.create({
        canvas: canvas,
        engine: engine,
        options: {
            width: width,
            height: height,
            wireframes: false,
            background: "#ffe4f2"
        }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    const ground = Bodies.rectangle(width / 2, height + 20, width, 40, {
        isStatic: true,
        render: { fillStyle: "#ffb703" }
    });

    const leftWall = Bodies.rectangle(-10, height / 2, 20, height, {
        isStatic: true,
        render: { fillStyle: "#ffb703" }
    });

    const rightWall = Bodies.rectangle(width + 10, height / 2, 20, height, {
        isStatic: true,
        render: { fillStyle: "#ffb703" }
    });

    World.add(world, [ground, leftWall, rightWall]);

    const snackTypes = [
        { name: "blueberry",  img: "blueberry.png.png",  radius: 12,  score: 10 },
        { name: "strawberry", img: "strawberry.png.png", radius: 18,  score: 20 },
        { name: "cookie",     img: "cookie.png.png",     radius: 26, score: 40 },
        { name: "whip",       img: "whip.png.png",       radius: 34, score: 80 },
        { name: "cheesecake", img: "cheesecake.png.png", radius: 45, score: 160 }
    ];

    const loadedImages = {};
    snackTypes.forEach(type => {
        const img = new Image();
        img.src = type.img;
        img.onload = () => {
            loadedImages[type.name] = img;
        };
    });

    let currentSnackIndex = 0;
    let isDropping = false;
    let score = 0;
    let gameOver = false;

    const scoreDiv = document.getElementById("score");
    const nextImg = document.getElementById("nextImg");
    const messageDiv = document.getElementById("message");
    const gameoverDiv = document.getElementById("gameover");
    const restartBtn = document.getElementById("restart");

    function updateScore(add) {
        score += add;
        scoreDiv.textContent = "スコア: " + score;
        if (score >= 500) messageDiv.style.display = "block";
    }

    function setNextSnack() {
        currentSnackIndex = Math.floor(Math.random() * snackTypes.length);
        nextImg.src = snackTypes[currentSnackIndex].img;
    }

    setNextSnack();

    function dropSnack(x) {
        if (isDropping || gameOver) return;
        isDropping = true;

        const type = snackTypes[currentSnackIndex];

        const body = Bodies.circle(x, 50, type.radius, {
            restitution: 0.2,
            friction: 0.8,
            render: {
                sprite: {
                    texture: type.img,
                    xScale: loadedImages[type.name]
                        ? (type.radius * 2) / loadedImages[type.name].width
                        : 1,
                    yScale: loadedImages[type.name]
                        ? (type.radius * 2) / loadedImages[type.name].height
                        : 1
                }
            }
        });

        body.snackType = type;
        body.circleRadius = type.radius;

        World.add(world, body);

        setTimeout(() => {
            isDropping = false;
            setNextSnack();
        }, 500);
    }

    canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        dropSnack(x);
    });

    Events.on(engine, "collisionStart", (event) => {
        const pairs = event.pairs;

        pairs.forEach(pair => {
            const a = pair.bodyA;
            const b = pair.bodyB;

            if (!a.snackType || !b.snackType) return;

            if (a.snackType.name !== b.snackType.name) return;

            const dx = a.position.x - b.position.x;
            const dy = a.position.y - b.position.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > a.circleRadius + b.circleRadius - 5) return;

            const index = snackTypes.findIndex(t => t.name === a.snackType.name);
            if (index === -1 || index === snackTypes.length - 1) return;

            const nextType = snackTypes[index + 1];

            const newX = (a.position.x + b.position.x) / 2;
            const newY = (a.position.y + b.position.y) / 2;

            World.remove(world, a);
            World.remove(world, b);

            const newBody = Bodies.circle(newX, newY, nextType.radius, {
                restitution: 0.2,
                friction: 0.8,
                render: {
                    sprite: {
                        texture: nextType.img,
                        xScale: loadedImages[nextType.name]
                            ? (nextType.radius * 2) / loadedImages[nextType.name].width
                            : 1,
                        yScale: loadedImages[nextType.name]
                            ? (nextType.radius * 2) / loadedImages[nextType.name].height
                            : 1
                    }
                }
            });

            newBody.snackType = nextType;
            newBody.circleRadius = nextType.radius;

            World.add(world, newBody);

            updateScore(nextType.score);
        });
    });

    Events.on(engine, "afterUpdate", () => {
        if (gameOver) return;

        const bodies = Composite.allBodies(world);
        for (let body of bodies) {
            if (body.snackType && body.position.y < 50) {
                gameOver = true;
                gameoverDiv.style.display = "block";
                break;
            }
        }
    });

    restartBtn.addEventListener("click", () => {
        const bodies = Composite.allBodies(world);
        bodies.forEach(b => {
            if (!b.isStatic) World.remove(world, b);
        });

        World.add(world, [ground, leftWall, rightWall]);

        score = 0;
        gameOver = false;
        scoreDiv.textContent = "スコア: 0";
        gameoverDiv.style.display = "none";
        messageDiv.style.display = "none";
        setNextSnack();
    });
    </script>
</body>
</html>
